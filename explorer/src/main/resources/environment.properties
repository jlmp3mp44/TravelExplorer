# Environment values are mapped here; application code uses Spring configuration.
# Process environment variables override values loaded from the local .env file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/explorer}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:604800000}
spring.app.jwtCookieName=${JWT_COOKIE_NAME:explorer}

google.api.key=${GOOGLE_API_KEY}
google.places.base-url=${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}
google.geocoding.base-url=${GOOGLE_GEOCODING_BASE_URL:https://maps.googleapis.com}

recommendation.service.url=${RECOMMENDATION_SERVICE_URL:http://localhost:8001}
