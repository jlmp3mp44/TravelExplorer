spring.application.name=explorer
google.places.base-url=https://places.googleapis.com
google.geocoding.base-url=https://maps.googleapis.com

# JWT lifetime (1 week). Cookie max-age matches via JwtUtils.
spring.app.jwtExpirationMs=604800000

spring.datasource.url=jdbc:postgresql://db:5432/explorer

# Docker: hostname matches recommendation-service in docker-compose
recommendation.service.url=http://recommendation-service:8001
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Existing databases: baseline then apply migrations (e.g. widen trip_itinerary kind CHECK for REPLACE).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.ecommerce.project=DEBUG

spring.profiles.include=secrets


