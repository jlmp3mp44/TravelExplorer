name: explorer

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-explorer}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in your .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-explorer}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in your .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-604800000}
      JWT_COOKIE_NAME: ${JWT_COOKIE_NAME:-explorer}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?Set GOOGLE_API_KEY in your .env}
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8001
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/public/countries || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  recommendation-service:
    build:
      context: ${RECOMMENDER_PATH:-../travel-recommender-service}
    restart: unless-stopped
    environment:
      RECOMMENDER_DB_HOST: db
      RECOMMENDER_DB_PORT: "5432"
      RECOMMENDER_DB_NAME: ${DB_NAME:-explorer}
      RECOMMENDER_DB_USER: ${DB_USERNAME:?Set DB_USERNAME in your .env}
      RECOMMENDER_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env}
      SVD_AUTO_RETRAIN_ENABLED: ${SVD_AUTO_RETRAIN_ENABLED:-true}
      SVD_AUTO_RETRAIN_INITIAL_DELAY_SECONDS: ${SVD_AUTO_RETRAIN_INITIAL_DELAY_SECONDS:-60}
      SVD_AUTO_RETRAIN_INTERVAL_SECONDS: ${SVD_AUTO_RETRAIN_INTERVAL_SECONDS:-3600}
    ports:
      - "127.0.0.1:${RECOMMENDER_PORT:-8001}:8001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ${FRONTEND_PATH:-D:/4th course/diploma/frontend}
      # Copy only source files; Windows node_modules must not overwrite Linux dependencies.
      dockerfile_inline: |
        FROM node:22-alpine AS build
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY index.html vite.config.js ./
        COPY src ./src
        COPY public ./public
        ARG VITE_GOOGLE_MAPS_API_KEY
        ARG VITE_DISABLE_GOOGLE_API=false
        ENV VITE_GOOGLE_MAPS_API_KEY=$$VITE_GOOGLE_MAPS_API_KEY
        ENV VITE_DISABLE_GOOGLE_API=$$VITE_DISABLE_GOOGLE_API
        ENV VITE_API_BASE_URL=""
        RUN npm run build
        FROM nginx:alpine
        COPY nginx.conf /etc/nginx/conf.d/default.conf
        COPY --from=build /app/dist /usr/share/nginx/html
        EXPOSE 80
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_DISABLE_GOOGLE_API: ${VITE_DISABLE_GOOGLE_API:-false}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
      recommendation-service:
        condition: service_healthy

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-explorer_pgdata}
