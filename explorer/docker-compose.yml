services:
  db:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: explorer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - explorer-net
  backend:
    image: explorerapi
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - explorer-net
  recommendation-service:
    image: recommendation-service
    ports:
      - "8001:8001"
    environment:
      RECOMMENDER_DB_HOST: db
      RECOMMENDER_DB_PASSWORD: admin
    depends_on:
      - db
    networks:
      - explorer-net
  frontend:
    build:
      context: D:/4th course/diploma/frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    image: explorer-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - explorer-net
networks:
  explorer-net:
    driver: bridge
volumes:
  postgres_data:
